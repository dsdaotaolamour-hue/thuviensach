{
  "openapi": "3.1.0",
  "info": {
    "title": "Lamour Library API",
    "version": "1.0.0",
    "description": "Same-origin API. Browser never accesses Supabase tables. Mutations require exact Origin; financial writes require Idempotency-Key. Dates YYYY-MM-DD, money integer VND."
  },
