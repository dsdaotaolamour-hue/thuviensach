  "components": {
    "securitySchemes": {
      "cookieSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "lamour_session"
      }
    },
    "schemas": {
      "IssueFields": {
        "type": "object",
        "required": [
          "readerId",
          "copyIds",
          "borrowDate"
        ],
        "properties": {
          "readerId": {
            "type": "string",
            "format": "uuid"
          },
          "copyIds": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            },
            "minItems": 1,
            "maxItems": 100,
            "uniqueItems": true
          },
          "borrowDate": {
            "type": "string",
            "format": "date"
          },
          "conditionNote": {
            "type": "string"
          },
          "walletId": {
            "type": "string",
            "format": "uuid"
          },
          "depositConfirmed": {
            "type": "boolean"
          },
          "warningAcknowledged": {
            "type": "boolean"
          },
          "quoteToken": {
            "type": "string"
          }
        }
      },
      "ReturnFields": {
        "type": "object",
        "required": [
          "itemId",
          "actualDate",
          "outcome"
        ],
        "properties": {
          "itemId": {
            "type": "string",
            "format": "uuid"
          },
          "actualDate": {
            "type": "string",
            "format": "date"
          },
          "outcome": {
            "enum": [
              "GOOD",
              "MINOR_DAMAGE",
              "MAJOR_DAMAGE",
              "LOST"
            ]
          },
          "damageAmount": {
            "type": "integer",
            "minimum": 0
          },
          "conditionIn": {
            "type": "string"
          },
          "reason": {
            "type": "string"
          },
          "decisionBy": {
            "type": "string"
          },
          "walletId": {
            "type": "string",
            "format": "uuid"
          },
          "cashConfirmed": {
            "type": "boolean"
          },
          "replacementReceived": {
            "type": "boolean"
          },
          "settleNow": {
            "type": "boolean"
          },
          "version": {
            "type": "integer",
            "minimum": 0
          },
          "quoteHash": {
            "type": "string"
          }
        }
      }
    }
  }
