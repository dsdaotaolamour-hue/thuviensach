          },
          "400": {
            "description": "Request không hợp lệ"
          },
          "401": {
            "description": "Chưa xác thực/hết phiên"
          },
          "403": {
            "description": "Sai Origin hoặc không có quyền"
          },
          "409": {
            "description": "Version/tồn kho/idempotency conflict"
          },
          "422": {
            "description": "Vi phạm nghiệp vụ"
